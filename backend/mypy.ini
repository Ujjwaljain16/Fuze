# Type check for a well-typed slice of the backend. Run from backend/: `mypy`
# Lenient on purpose: no strict mode, untyped third-party packages are treated as Any.
[mypy]
python_version = 3.11
files = core, utils
explicit_package_bases = True
ignore_missing_imports = True
# Modules outside `files` are read for their types but their own errors are not reported.
follow_imports = silent
