name: Keep Scheduled Workflows Enabled

# GitHub disables the scheduled workflows of a public repository after 60 days without
# repository activity, silently. That would stop the backups and every keep-alive, and the free
# database and Redis would then be paused or archived. Re-enabling a workflow through the API
# resets its inactivity timer (the mechanism liskin/gh-workflow-keepalive is built on), so this
# re-enables every scheduled workflow, itself included, well inside the 60 days.
on:
  schedule:
    - cron: '17 4 1,15 * *'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Re-enable every scheduled workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          failed=0
          while IFS=$'\t' read -r id state path; do
            [ -f "$path" ] || continue
            grep -qE '^[[:space:]]+schedule:' "$path" || continue
            # A workflow someone disabled on purpose stays disabled.
            if [ "$state" = "disabled_manually" ]; then
              echo "::notice::$path was disabled manually; leaving it alone."
              continue
            fi
            if gh api -X PUT "repos/$GH_REPO/actions/workflows/$id/enable" --silent; then
              echo "enabled $path (was $state)"
            else
              echo "::error::could not enable $path"
              failed=1
            fi
          done < <(gh api --paginate "repos/$GH_REPO/actions/workflows" --jq '.workflows[] | [.id, .state, .path] | @tsv')
          exit "$failed"

      - name: Open or update an issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TITLE: Scheduled workflows could not be re-enabled
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          note="Failed again at $(date -u '+%Y-%m-%d %H:%M UTC'): $RUN_URL"
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$note"
          else
            gh issue create --title "$TITLE" --body "Re-enabling the scheduled workflows failed at $(date -u '+%Y-%m-%d %H:%M UTC'): $RUN_URL

          GitHub disables scheduled workflows after 60 days without repository activity, which would stop the backups and keep-alives. Check the run log, re-enable any disabled workflow from the Actions tab, and close this issue once this workflow passes again. Later failures are added here as comments."
          fi
