name: Database Keep-Alive Ping

on:
  # Run every 6 hours (at 00:00, 06:00, 12:00, 18:00 UTC)
  schedule:
    - cron: '0 */6 * * *'
  
  # Allow manual triggering from GitHub Actions UI
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping-database:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install psycopg2-binary python-dotenv
      
      - name: Ping database
        id: ping
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python scripts/ping_db.py

      # Supabase decides "inactive" from its own view of project traffic, and a SQL session through
      # the pooler alone has not always counted. A request through the API gateway does, whatever
      # it answers: since 0013 the anon key may get 401/403/404 here, which is fine.
      - name: Ping Supabase REST API
        id: rest
        if: ${{ !cancelled() }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::notice::SUPABASE_URL or SUPABASE_ANON_KEY is not set; skipping the REST ping (the SQL ping still runs)."
            exit 0
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
            -H "apikey: $SUPABASE_ANON_KEY" "${SUPABASE_URL%/}/rest/v1/") || code=000
          case "$code" in
            2??|401|403|404) echo "Supabase REST answered HTTP $code" ;;
            *) echo "::error::Supabase REST answered HTTP $code (000 = no answer); the project may be paused."; exit 1 ;;
          esac

      - name: Report status
        if: always()
        run: |
          if [ "${{ steps.ping.outcome }}" = "success" ] && [ "${{ steps.rest.outcome }}" != "failure" ]; then
            echo "✅ Database ping successful at $(date)"
          else
            echo "❌ Database ping failed at $(date) (SQL: ${{ steps.ping.outcome }}, REST: ${{ steps.rest.outcome }})"
            exit 1
          fi

      # Nobody watches scheduled runs; without this a failing ping goes unnoticed until the
      # free-tier database is paused for inactivity.
      - name: Open or update an issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TITLE: Database keep-alive ping is failing
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          note="Failed again at $(date -u '+%Y-%m-%d %H:%M UTC'): $RUN_URL"
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$note"
          else
            gh issue create --title "$TITLE" --body "The scheduled database keep-alive failed at $(date -u '+%Y-%m-%d %H:%M UTC'): $RUN_URL

          A free-tier Postgres project is paused after a period without activity. Check the run log and the DATABASE_URL, SUPABASE_URL and SUPABASE_ANON_KEY secrets, and close this issue once the ping passes again. Later failures are added here as comments."
          fi
