name: Database Keep-Alive Ping

on:
  # Run every 6 hours (at 00:00, 06:00, 12:00, 18:00 UTC)
  schedule:
    - cron: '0 */6 * * *'
  
  # Allow manual triggering from GitHub Actions UI
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping-database:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install psycopg2-binary python-dotenv
      
      - name: Ping database
        id: ping
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python scripts/ping_db.py

      - name: Report status
        if: always()
        run: |
          if [ "${{ steps.ping.outcome }}" = "success" ]; then
            echo "✅ Database ping successful at $(date)"
          else
            echo "❌ Database ping failed at $(date)"
            exit 1
          fi

      # Nobody watches scheduled runs; without this a failing ping goes unnoticed until the
      # free-tier database is paused for inactivity.
      - name: Open or update an issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TITLE: Database keep-alive ping is failing
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          note="Failed again at $(date -u '+%Y-%m-%d %H:%M UTC'): $RUN_URL"
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$note"
          else
            gh issue create --title "$TITLE" --body "The scheduled database keep-alive failed at $(date -u '+%Y-%m-%d %H:%M UTC'): $RUN_URL

          A free-tier Postgres project is paused after a period without activity. Check the run log and the DATABASE_URL secret, and close this issue once the ping passes again. Later failures are added here as comments."
          fi
