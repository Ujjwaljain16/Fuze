name: Sync Backend to Hugging Face Space

# Deploy only what Backend CI has tested: this runs after a successful Backend CI run
# on a push to main, and deploys exactly the commit that run tested.
on:
  workflow_run:
    workflows: ["Backend CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hf-space-deploy
  cancel-in-progress: false

jobs:
  sync:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Clone HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git clone https://huggingface:$HF_TOKEN@huggingface.co/spaces/Ujjwaljain16/fuze-backend hf-space
          cd hf-space
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Sync backend files
        run: |
          # --delete: modules removed from the repo must disappear from the Space too
          # (cp -r only ever added files, so deleted code kept running there).
          rsync -a --delete --delete-excluded --exclude '__pycache__/' --exclude '*.pyc' \
            --exclude 'tests/' --exclude 'scratch/' --exclude 'brain/' --exclude 'eval/' \
            --exclude '*.log' --exclude '.env*' \
            backend/ hf-space/backend/
          for f in requirements.txt requirements.lock Dockerfile .dockerignore app.py wsgi.py start.sh supervisord.conf alembic.ini; do
            cp "$f" hf-space/
          done

      - name: Commit and push to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          cd hf-space
          git add -A
          git diff --staged --quiet || git commit -m "chore: sync from main @ ${SHA::7} [skip ci]"
          BRANCH=$(git branch --show-current || echo "main")
          git push origin HEAD:$BRANCH
