name: Frontend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
      - 'frontend/eslint.config.js'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
      - 'frontend/eslint.config.js'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '20'
      
      - name: Cache npm dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      
      # Required: errors and warnings both fail the build.
      - name: Run ESLint
        working-directory: frontend
        run: npm run lint -- --max-warnings=0
      
      - name: Run unit tests
        working-directory: frontend
        run: npm test -- --run

      - name: Verify production build
        # Only css-lint.yml previously ran `npm run build`, and it only
        # triggers on *.css changes -- a JS/JSX-only change (this workflow's
        # actual trigger) could break the production build (bad import,
        # something ESLint/vitest don't catch) with no CI workflow ever
        # noticing.
        working-directory: frontend
        run: npm run build

      - name: Upload test coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7


