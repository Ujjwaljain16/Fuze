name: Backend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - 'requirements.txt'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - 'requirements.txt'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: fuze_test
          POSTGRES_PASSWORD: fuze_test_password
          POSTGRES_DB: fuze_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fuze_test -d fuze_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r ../requirements.txt

      - name: Run Alembic migrations and drift check
        env:
          DATABASE_URL: postgresql://fuze_test:fuze_test_password@localhost:5432/fuze_test_db
          ENVIRONMENT: test
          PYTHONPATH: backend
        run: |
          python -m alembic upgrade head
          python -m alembic check

      - name: Run tests with coverage
        working-directory: backend
        env:
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
          DATABASE_URL: 'sqlite:///:memory:'
          GEMINI_API_KEY: 'test-key-for-ci'
        run: |
          pytest --cov=. --cov-report=xml --cov-report=html -v
      
      - name: Upload coverage reports
        if: always()
        continue-on-error: true
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      
      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-html
          path: backend/htmlcov/
          retention-days: 7


