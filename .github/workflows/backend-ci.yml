name: Backend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - 'requirements.txt'
      - 'requirements.lock'
      - 'requirements-dev.txt'
      - 'Dockerfile'
      - '.dockerignore'
      - 'start.sh'
      - 'supervisord.conf'
      - 'gunicorn.conf.py'
      - 'alembic.ini'
      - 'app.py'
      - 'wsgi.py'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - 'requirements.txt'
      - 'requirements.lock'
      - 'requirements-dev.txt'
      - 'Dockerfile'
      - '.dockerignore'
      - 'start.sh'
      - 'supervisord.conf'
      - 'gunicorn.conf.py'
      - 'alembic.ini'
      - 'app.py'
      - 'wsgi.py'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: fuze_test
          POSTGRES_PASSWORD: fuze_test_password
          POSTGRES_DB: fuze_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fuze_test -d fuze_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r ../requirements-dev.txt

      # Known-vulnerable pins fail the build. The lock covers every transitive package;
      # requirements.txt adds torch, whose +cpu build in the lock isn't on PyPI to look up.
      - name: Audit Python dependencies
        run: |
          pip-audit -r requirements.lock --require-hashes --disable-pip --progress-spinner off
          pip-audit -r requirements.txt --no-deps --disable-pip --progress-spinner off

      - name: Run Alembic migrations and drift check
        env:
          DATABASE_URL: postgresql://fuze_test:fuze_test_password@localhost:5432/fuze_test_db
          APP_ENV: testing
          PYTHONPATH: backend
        run: |
          python -m alembic upgrade head
          python -m alembic check

      - name: Run tests with coverage
        working-directory: backend
        env:
          REDIS_URL: redis://localhost:6379/0
          APP_ENV: testing
          DATABASE_URL: 'sqlite:///:memory:'
          GEMINI_API_KEY: 'test-key-for-ci'
        run: |
          pytest --cov=. --cov-report=xml --cov-report=html -v
      
      # SQLite can't run pgvector queries, row locks or real concurrency; this lane can.
      - name: Run tests on Postgres + pgvector
        working-directory: backend
        env:
          REDIS_URL: redis://localhost:6379/0
          APP_ENV: testing
          TEST_DATABASE_URL: postgresql://fuze_test:fuze_test_password@localhost:5432/fuze_test_db
          GEMINI_API_KEY: 'test-key-for-ci'
        run: |
          pytest -q

      - name: Upload coverage reports
        if: always()
        continue-on-error: true
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238  # v4.6.0
        with:
          file: ./backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      
      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: backend-coverage-html
          path: backend/htmlcov/
          retention-days: 7


