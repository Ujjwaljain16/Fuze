[supervisord]
user=root
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:gunicorn]
; workers=2 matches the HF Space's confirmed `cpu-basic` hardware (2 vCPU --
; verified via the Spaces API: {"requested": "cpu-basic"}, which is documented
; as 2 vCPU / 16GB RAM). A single worker meant one process handled ALL HTTP
; traffic; any CPU-bound work (embedding inference, JSON/regex-heavy request
; handling) on that one process stalled every other concurrent request, since
; gevent's cooperative concurrency only helps with I/O-bound waits, not CPU
; contention. No --preload: each worker independently creates its own DB/Redis
; connections after fork, avoiding the well-known gunicorn+gevent gotcha where
; preloading (initializing pooled connections in the master before fork) can
; leave forked workers sharing file descriptors for connections that were
; never gevent-monkey-patched in that worker, causing corruption/hangs.
command=gunicorn app:app --bind 0.0.0.0:%(ENV_PORT)s --workers 2 --worker-class gevent --worker-connections 1000 --timeout 2000 --keep-alive 5 --access-logfile - --error-logfile -
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:rq_worker]
command=python backend/worker.py --queue default
autostart=true
autorestart=true
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:rq_worker_high]
; High-priority queue: cache warming jobs (login-triggered)
command=python backend/worker.py --queue high
autostart=true
autorestart=true
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
