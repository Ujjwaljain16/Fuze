services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file: .env
    environment:
      PORT: "7860"
    restart: unless-stopped
    expose:
      - "7860"
    volumes:
      - model_cache:/root/.cache

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  model_cache:
  caddy_data:
  caddy_config:
